services:
  call-planner:
    build: .
    # INSTANCE and HOST_PORT (in .env) let a second copy, e.g. a test site, run
    # on the same server: INSTANCE=call-planner-test, HOST_PORT=4001.
    image: ${INSTANCE:-call-planner}
    container_name: ${INSTANCE:-call-planner}
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-4000}:4000"
    volumes:
      - call-planner-data:/data
      # Daily database backups land in ./backups next to this file, so they're
      # easy to copy off the server. Create it once: mkdir -p backups && sudo chown 1000:1000 backups
      - ./backups:/data/backups
    env_file: .env

volumes:
  call-planner-data:
